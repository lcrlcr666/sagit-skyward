# WCNSS_qcom_cfg.ini — recovery 精简版（QCA6174A / WCN3990 通用关键项）
# 放到 /vendor/firmware/wlan/qca_cld/WCNSS_qcom_cfg.ini

gEnableBmps=1
gEnableImps=1
gEnableSuspend=3
gEnablePowerSaveOffload=4
gBypassPowerSaveLock=1
gEnableSapSuspend=1

gInterfaceName=wlan0
gEnablefwlog=0
gEnableDebugLog=0
gEnableDebugLogTimestamp=0
gEnableModuleLog=0
gHostLogging=0

# 监管域：recovery 没有 telephony，必须自带
g11dSupportEnabled=1
gCountryCodePriority=0
gEnableRegulatoryDomain=1
gCountryCode=CN
gNthBeaconFilter=0

# 扫描/漫游（下载大 ROM 时避免频繁断流）
gNeighborScanTimerPeriod=200
gNeighborLookupThreshold=78
gRoamIntraBand=0
gRoamingTime=0
gFastRoamEnabled=0
gStaKeepAlivePeriod=25
gMaxTxPower=30
gTxPowerCap=30

gEnableDynDtim=1
gDtimMultiplierFactorToRt=2
gEnableCloseLoop=1
gEnableMemDeepSleep=1

gEnableNAPT=1
gEnableIpv6=1
gEnableActiveModeOffload=1
gEnableTxrxHostWakeup=1

# MAC 可由 sagit-wifi-up.sh 追加 Intf0MacAddress=<xx:xx:xx:xx:xx:xx>
