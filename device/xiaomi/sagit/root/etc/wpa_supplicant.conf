# recovery 用 wpa_supplicant 配置 —— 把 SSID/PSK 改成你自己的
# 注意：recovery 无 keystore，只能用明文 PSK（或先跑 wpa_passphrase 生成）
ctrl_interface=/data/misc/wifi/sockets
ctrl_interface_group=0
update_config=1
country=CN

network={
    ssid="TARGET_SSID"
    psk="TARGET_PSK"
    key_mgmt=WPA-PSK
    proto=RSN
    pairwise=CCMP
    priority=1
}

